name: CI

on: [push, pull_request, workflow_call]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Run Coverage Checks
        run: uv run poe test-cov-check

      - name: Run Security Checks
        run: uv run poe security

      - name: Check conventional commit
        run: |
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
          else
            BASE_SHA=${{ github.event.before }}
          fi
          # Validate each commit message follows the conventional commit format
          git log --format="%s" ${BASE_SHA}..${{ github.sha }} | while read -r msg; do
            echo "Validating: $msg"
            echo "$msg" > /tmp/commit_msg.text
            uv run --with conventional-pre-commit conventional-pre-commit /tmp/commit_msg.text || exit 1
          done

      - name: Check no diffs by pipeline
        run: git status --porcelain

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest
